[project]
site_name = "RustiCal Documentation"
site_url = "https://lennart-k.github.io/rustical/"
site_description = "a CalDAV/CardDAV server"

repo_name = "lennart-k/rustical"
repo_url = "https://github.com/lennart-k/rustical"

nav = [
  { "Home" = "index.md" },
  { "Installation" = [
    "installation/index.md",
    { "Configuration" = "installation/configuration.md" },
    { "Notes" = "installation/notes.md" },
  ] },
  { "Client Setup" = "setup/client.md" },
  { "OpenID Connect" = "setup/oidc.md" },
  { "Developers" = [
    "developers/index.md",
    { "Relevant RFCs" = [
      "developers/rfcs.md",
      { "RFC 6352" = "developers/rfcs/rfc6352.md" },
    ] },
    { "Frontend" = "developers/frontend.md" },
    { "Debugging" = "developers/debugging.md" },
  ] },
  { "Cargo docs" = "/rustical/_crate/rustical/" },
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme]
features = [
  "content.code.copy",
  "content.code.annotate",
  "content.tooltips",
  "navigation.indices",
  "navigation.tabs",
  "navigation.indexes",
  "navigation.indexes",
  "navigation.instant",
  "navigation.footer"
]

[project.markdown_extensions]
fenced_code = {}
smarty = {}
"pymdownx.highlight" = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
"pymdownx.inlinehilite" = {}
"pymdownx.snippets" = {}
"pymdownx.superfences" = {}
admonition = {}
attr_list = {}
"pymdownx.tabbed" = {}
"pymdownx.tasklist" = { custom_checkbox = true }
