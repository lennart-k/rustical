name: "CICD"
on: [push, pull_request]
permissions:
  contents: read
  pull-requests: write

env:
  RUST_VERSION: "1.97"
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Checkout sources
        uses: actions/checkout@v4
      - run: cargo check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: rustical
          POSTGRES_USER: rustical
          POSTGRES_DB: rustical
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rustical"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://rustical:rustical@localhost:5432/rustical
    steps:
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Checkout sources
        uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.9.0
      - name: Verify postgres query cache
        working-directory: crates/store_postgres
        env:
          SQLX_OFFLINE: "false"
        run: |
          cargo sqlx migrate run
          cargo sqlx prepare --check
      - run: cargo test --all-features --verbose --workspace

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: rustical
          POSTGRES_USER: rustical
          POSTGRES_DB: rustical
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rustical"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://rustical:rustical@localhost:5432/rustical
    steps:
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Run tarpaulin
        run: cargo tarpaulin --workspace --all-features --exclude xml_derive --coveralls ${{ secrets.COVERALLS_REPO_TOKEN }}

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings
