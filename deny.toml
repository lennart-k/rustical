[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "Zlib",
  "MPL-2.0",
  "AGPL-3.0-or-later",
  "GPL-3.0-or-later",
]


[advisories]
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "We don't really use RSA" },
  { id = "RUSTSEC-2026-0543", reason = "chrono: We'll switch to jiff in the future" },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz: We'll switch to jiff in the future" },
  { id = "RUSTSEC-2024-0436", reason = "paste: No good alternative. We need to wait for https://github.com/rust-lang/rust/issues/124225 and fork if if paste breaks" },
  { id = "RUSTSEC-2026-0374", reason = "basic-toml: used by askama, fixed in its next release" },
]

[bans]
deny = [
    { crate = "openssl-sys", reason = "If we need openssl we need to watch out with linking" },
]
